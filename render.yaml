services:
  - type: web
    name: careeriq
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        value: careeriq-production-2024
      - key: PYTHON_VERSION
        value: 3.11.0